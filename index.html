<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>MapLibre on GitHub Pages</title>

    <!-- MapLibre GL JS (CDN) -->
    <link
      href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

    <style>
      body { margin: 0; font-family: system-ui, sans-serif; }
      #map { height: 70vh; width: 100vw; }
      #panel { padding: 12px 16px; }
      #coords { white-space: pre; background: #f6f8fa; padding: 12px; border-radius: 8px; overflow: auto; }
      button { padding: 8px 10px; cursor: pointer; }
    </style>
  </head>

  <body>
    <div id="map"></div>

    <div id="panel">
      <div style="display:flex; gap:12px; align-items:center; flex-wrap:wrap;">
        <strong>Click the map to add station points</strong>
        <button id="clear">Clear points</button>
      </div>
      <p>Lat/Lon list (copy into CSV, etc.):</p>
      <div id="coords"></div>
    </div>

    <script>
      // Minimal raster basemap style using public OSM tiles.
      // For production/high-traffic use, use a proper tile provider or host your own tiles.
      const rasterStyle = {
        version: 8,
        sources: {
          osm: {
            type: "raster",
            tiles: [
              "https://a.tile.openstreetmap.org/{z}/{x}/{y}.png",
              "https://b.tile.openstreetmap.org/{z}/{x}/{y}.png",
              "https://c.tile.openstreetmap.org/{z}/{x}/{y}.png"
            ],
            tileSize: 256,
            attribution:
              '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
          }
        },
        layers: [
          { id: "osm", type: "raster", source: "osm" }
        ]
      };

      const map = new maplibregl.Map({
        container: "map",
        style: rasterStyle,
        center: [-104.9903, 39.7392], // Denver default
        zoom: 10
      });

      map.addControl(new maplibregl.NavigationControl(), "top-right");

      // Store points as GeoJSON features
      let points = [];

      function pointsGeoJSON() {
        return {
          type: "FeatureCollection",
          features: points
        };
      }

      function renderPoints() {
        const srcId = "stations";
        const layerId = "stations-layer";

        if (!map.getSource(srcId)) {
          map.addSource(srcId, { type: "geojson", data: pointsGeoJSON() });

          map.addLayer({
            id: layerId,
            type: "circle",
            source: srcId,
            paint: {
              "circle-radius": 6,
              "circle-stroke-width": 2,
              "circle-color": "#2b6cb0",
              "circle-stroke-color": "#ffffff"
            }
          });
        } else {
          map.getSource(srcId).setData(pointsGeoJSON());
        }

        // Update coordinate panel
        const lines = points.map((f, i) => {
          const [lon, lat] = f.geometry.coordinates;
          return `${i + 1}\t${lat.toFixed(6)}\t${lon.toFixed(6)}`;
        });

        const header = "idx\tlat\tlon\n";
        document.getElementById("coords").textContent = header + lines.join("\n");
      }

      map.on("load", () => {
        renderPoints();

        map.on("click", (e) => {
          const lon = e.lngLat.lng;
          const lat = e.lngLat.lat;

          points.push({
            type: "Feature",
            properties: { name: `Station ${points.length + 1}` },
            geometry: { type: "Point", coordinates: [lon, lat] }
          });

          renderPoints();
        });

        document.getElementById("clear").addEventListener("click", () => {
          points = [];
          renderPoints();
        });
      });
    </script>
  </body>
</html>
