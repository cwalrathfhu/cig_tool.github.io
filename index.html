<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>MapLibre Station Picker (Points + 1/2-mile Buffers)</title>

    <!-- MapLibre GL JS (CDN) -->
    <link
      href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

    <!-- Turf.js for browser-side buffering -->
    <script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>

    <style>
      body { margin: 0; font-family: system-ui, sans-serif; }
      #map { height: 70vh; width: 100vw; }
      #panel { padding: 12px 16px; }
      #coords {
        white-space: pre;
        background: #f6f8fa;
        padding: 12px;
        border-radius: 8px;
        overflow: auto;
      }
      button { padding: 8px 10px; cursor: pointer; }
      .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
      .muted { color: #555; }
    </style>
  </head>

  <body>
    <div id="map"></div>

    <div id="panel">
      <div class="row">
        <strong>Click the map to add station points</strong>
        <button id="undo">Delete last point</button>
        <button id="clear">Clear points</button>
      </div>

      <p class="muted">
        Each click adds a station point and a semi-transparent <b>0.5-mile</b> radial buffer.
      </p>

      <p>Lat/Lon list (copy into CSV, etc.):</p>
      <div id="coords"></div>
    </div>

    <script>
      // Minimal raster basemap style using public OSM tiles.
      // For production/high-traffic use, use a proper tile provider or host your own tiles.
      const rasterStyle = {
        version: 8,
        sources: {
          osm: {
            type: "raster",
            tiles: [
              "https://a.tile.openstreetmap.org/{z}/{x}/{y}.png",
              "https://b.tile.openstreetmap.org/{z}/{x}/{y}.png",
              "https://c.tile.openstreetmap.org/{z}/{x}/{y}.png"
            ],
            tileSize: 256,
            attribution:
              '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
          }
        },
        layers: [{ id: "osm", type: "raster", source: "osm" }]
      };

      const map = new maplibregl.Map({
        container: "map",
        style: rasterStyle,
        center: [-104.9903, 39.7392], // Denver default
        zoom: 10
      });

      map.addControl(new maplibregl.NavigationControl(), "top-right");

      // Store points and corresponding 1/2-mile buffers as GeoJSON features
      let points = [];
      let buffers = [];

      function pointsGeoJSON() {
        return { type: "FeatureCollection", features: points };
      }

      function buffersGeoJSON() {
        return { type: "FeatureCollection", features: buffers };
      }

      function updateCoordsPanel() {
        const lines = points.map((f, i) => {
          const [lon, lat] = f.geometry.coordinates;
          return `${i + 1}\t${lat.toFixed(6)}\t${lon.toFixed(6)}`;
        });
        const header = "idx\tlat\tlon\n";
        document.getElementById("coords").textContent = header + lines.join("\n");
      }

      function renderLayers() {
        const ptsSrc = "stations";
        const ptsLayer = "stations-layer";

        const bufSrc = "buffers";
        const bufFillLayer = "buffers-fill";
        const bufLineLayer = "buffers-line";

        // --- Buffers ---
        if (!map.getSource(bufSrc)) {
          map.addSource(bufSrc, { type: "geojson", data: buffersGeoJSON() });

          map.addLayer({
            id: bufFillLayer,
            type: "fill",
            source: bufSrc,
            paint: {
              "fill-color": "#2b6cb0",
              "fill-opacity": 0.2
            }
          });

          map.addLayer({
            id: bufLineLayer,
            type: "line",
            source: bufSrc,
            paint: {
              "line-color": "#2b6cb0",
              "line-width": 2,
              "line-opacity": 0.6
            }
          });
        } else {
          map.getSource(bufSrc).setData(buffersGeoJSON());
        }

        // --- Points ---
        if (!map.getSource(ptsSrc)) {
          map.addSource(ptsSrc, { type: "geojson", data: pointsGeoJSON() });

          map.addLayer({
            id: ptsLayer,
            type: "circle",
            source: ptsSrc,
            paint: {
              "circle-radius": 6,
              "circle-stroke-width": 2,
              "circle-color": "#2b6cb0",
              "circle-stroke-color": "#ffffff"
            }
          });
        } else {
          map.getSource(ptsSrc).setData(pointsGeoJSON());
        }

        updateCoordsPanel();
      }

      function addStationPoint(lon, lat) {
        const idx = points.length + 1;

        // Add point feature
        points.push({
          type: "Feature",
          properties: { name: `Station ${idx}`, stationIdx: idx },
          geometry: { type: "Point", coordinates: [lon, lat] }
        });

        // Add 0.5-mile buffer polygon (circle)
        const pt = turf.point([lon, lat]);
        const circle = turf.circle(pt, 0.5, { units: "miles", steps: 64 });

        buffers.push({
          ...circle,
          properties: { stationIdx: idx }
        });

        renderLayers();
      }

      map.on("load", () => {
        // Initial draw (empty)
        renderLayers();

        // Add point + buffer on click
        map.on("click", (e) => {
          addStationPoint(e.lngLat.lng, e.lngLat.lat);
        });

        // Clear all
        document.getElementById("clear").addEventListener("click", () => {
          points = [];
          buffers = [];
          renderLayers();
        });

        // Delete last
        document.getElementById("undo").addEventListener("click", () => {
          if (points.length > 0) {
            points.pop();
            buffers.pop();
            renderLayers();
          }
        });
      });
    </script>
  </body>
</html>
